<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Audio Wikipedia Avancé</title>

        * {
            box-sizing: border-box;

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);

            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #1d1d1f;
        }
        button {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            margin-bottom: 12px;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #86868b;
            cursor: not-allowed;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .secondary-btn {
            background-color: #e8e8ed;
            color: #1d1d1f;
            padding: 10px;
            font-size: 0.9rem;
        }

            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #515154;
        }
