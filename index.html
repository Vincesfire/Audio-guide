<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guide Audio Touristique</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b132b;
            color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }
        .card {
            background: #1c2541;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid #3a506b;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.35rem;
            margin: 8px 0 14px 0;
            color: #ffffff;
        }
        button {
            background-color: #ffd166;
            color: #0b132b;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 28px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(255, 209, 102, 0.2);
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #3a506b;
            color: #8d99ae;
            cursor: not-allowed;
            box-shadow: none;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 12px 0;
            color: #8d99ae;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #3a506b;
        }
        .divider span {
            padding: 0 8px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 24px;
            border: 1px solid #3a506b;
            background-color: #0b132b;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            -webkit-appearance: none;
        }
        .search-box input:focus {
            border-color: #ffd166;
        }
        .search-box button {
            width: 50px;
            flex-shrink: 0;
            margin-bottom: 0;
            padding: 0;
            border-radius: 24px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .secondary-btn {
            background-color: #28385e;
            color: #f0f2f5;
            padding: 12px;
            font-size: 0.9rem;
            border: 1px solid #3a506b;
        }
        .more-btn {
            background-color: #28385e;
            color: #ffd166;
            border: 1px solid #ffd166;
            margin-top: 12px;
            display: none;
        }
        .speed-control {
            margin: 12px 0 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #b0c4de;
            background: #0b132b;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #3a506b;
        }
        .speed-control select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #3a506b;
            background: #1c2541;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }
        #status {
            margin: 10px 0;
            font-size: 0.85rem;
            color: #ffd166;
            min-height: 20px;
            padding: 0 4px;
            word-break: break-word;
        }
        #place-image-container {
            margin: 12px 0;
            display: none;
        }
        #place-image {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid #3a506b;
        }
        #article-title {
            font-weight: bold;
            font-size: 1.05rem;
            margin: 8px 0 4px 0;
            color: #ffd166;
            word-break: break-word;
        }
        #output {
            text-align: left;
            background: #0b132b;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 8px;
            display: none;
            color: #e2e8f0;
            border: 1px solid #3a506b;
            -webkit-overflow-scrolling: touch;
        }
        #wikipedia-link-container {
            margin-top: 14px;
            display: none;
            font-size: 0.85rem;
        }
        #wikipedia-link-container a {
            color: #ffd166;
            text-decoration: none;
            font-weight: 500;
            word-break: break-word;
        }
        #wikipedia-link-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Guide Audio Touristique</h1>
    
    <button id="listen-btn" onclick="startGuideGPS()">📍 Écouter le lieu actuel (GPS)</button>
    
    <div class="divider"><span>OU SAISIR UN LIEU</span></div>

    <div class="search-box">
        <input type="text" id="manual-place-input" placeholder="Ex: Panthéon, Massy..." onkeypress="handleKeyPress(event)">
        <button id="search-btn" onclick="startGuideManual()">🔍</button>
    </div>

    <div class="speed-control">
        <label for="speed-select">Vitesse de lecture :</label>
        <select id="speed-select" onchange="changeSpeed()">
            <option value="0.75">0.75x (Lent)</option>
            <option value="1.0">1.0x (Normal)</option>
            <option value="1.1" selected>1.1x (Idéal)</option>
            <option value="1.25">1.25x (Rapide)</option>
            <option value="1.5">1.5x (Très rapide)</option>
            <option value="2.0">2.0x (Max)</option>
        </select>
    </div>

    <div class="controls">
        <button id="pause-btn" class="secondary-btn" onclick="pauseAudio()" disabled>Pause</button>
        <button id="stop-btn" class="secondary-btn" onclick="stopAudio()" disabled>Arrêter</button>
    </div>

    <div id="status">Choisissez une méthode pour démarrer.</div>
    
    <div id="place-image-container">
        <img id="place-image" src="" alt="Photo du lieu identifié">
    </div>
    
    <div id="article-title"></div>
    <div id="output"></div>

    <button id="more-btn" class="more-btn" onclick="loadMoreDetails()" style="display: none;">📖 En savoir plus (+2 min)</button>

    <div id="wikipedia-link-container">
        <a id="wikipedia-link" href="#" target="_blank">📖 Lire l'article complet sur Wikipédia</a>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    let currentUtterance = null;
    let allParagraphs = [];
    let currentParagraphIndex = 0;
    let currentTitle = "";

    function setStatus(text) {
        document.getElementById('status').innerText = text;
    }

    function resetUI() {
        stopAudio();
        document.getElementById('output').style.display = 'none';
        document.getElementById('article-title').innerText = '';
        document.getElementById('place-image-container').style.display = 'none';
        document.getElementById('wikipedia-link-container').style.display = 'none';
        document.getElementById('more-btn').style.display = 'none';
        allParagraphs = [];
        currentParagraphIndex = 0;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            startGuideManual();
            document.getElementById('manual-place-input').blur(); // Masquer le clavier virtuel sur mobile
        }
    }

    function startGuideGPS() {
        resetUI();

        if (!navigator.geolocation) {
            setStatus("La géolocalisation n'est pas supportée par votre navigateur.");
            return;
        }

        setStatus("Recherche de votre position GPS...");
        document.getElementById('listen-btn').disabled = true;

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                setStatus(`Position trouvée (${lat.toFixed(4)}, ${lon.toFixed(4)}). Recherche...`);
                fetchWikipediaByCoords(lat, lon);
            },
            (error) => {
                document.getElementById('listen-btn').disabled = false;
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        setStatus("Erreur : Permission GPS refusée.");
                        break;
                    case error.POSITION_UNAVAILABLE:
                        setStatus("Erreur : Position GPS indisponible.");
                        break;
                    case error.TIMEOUT:
                        setStatus("Erreur : Temps d'attente dépassé.");
                        break;
                    default:
                        setStatus("Erreur GPS inconnue.");
                }
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    function startGuideManual() {
        const inputField = document.getElementById('manual-place-input');
        const query = inputField.value.trim();
        if (!query) {
            setStatus("Veuillez saisir un nom de lieu.");
            return;
        }

        inputField.blur(); // Fermer le clavier virtuel sur mobile
        resetUI();
        setStatus(`Recherche de "${query}"...`);
        fetchWikipediaBySearch(query);
    }

    async function fetchWikipediaByCoords(lat, lon) {
        try {
            const geosearchUrl = `https://fr.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}|${lon}&gsradius=3000&gslimit=1&format=json&origin=*`;
            const geoResponse = await fetch(geosearchUrl);
            const geoData = await geoResponse.json();

            if (!geoData.query || !geoData.query.geosearch || geoData.query.geosearch.length === 0) {
                setStatus("Aucun article touristique trouvé à proximité.");
                document.getElementById('listen-btn').disabled = false;
                return;
            }

            const pageId = geoData.query.geosearch[0].pageid;
            loadArticleDetails(pageId);

        } catch (err) {
            console.error(err);
            setStatus("Erreur lors de la recherche GPS.");
            document.getElementById('listen-btn').disabled = false;
        }
    }

    async function fetchWikipediaBySearch(queryText) {
        try {
            const searchUrl = `https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(queryText)}&srlimit=1&format=json&origin=*`;
            const response = await fetch(searchUrl);
            const data = await response.json();

            if (!data.query || !data.query.search || data.query.search.length === 0) {
                setStatus(`Aucun résultat pour "${queryText}".`);
                document.getElementById('listen-btn').disabled = false;
                return;
            }

            const pageId = data.query.search[0].pageid;
            loadArticleDetails(pageId);

        } catch (err) {
            console.error(err);
            setStatus("Erreur lors de la recherche du lieu.");
            document.getElementById('listen-btn').disabled = false;
        }
    }

    async function loadArticleDetails(pageId) {
        try {
            const detailUrl = `https://fr.wikipedia.org/w/api.php?action=query&prop=extracts|pageimages&exintro=0&explaintext=1&piprop=original&pageids=${pageId}&format=json&origin=*`;
            const detailResponse = await fetch(detailUrl);
            const detailData = await detailResponse.json();

            const page = detailData.query.pages[pageId];
            currentTitle = page.title;

            setStatus(`Lieu trouvé : "${currentTitle}". Chargement...`);
            document.getElementById('article-title').innerText = currentTitle;

            const wikiUrl = `https://fr.wikipedia.org/?curid=${pageId}`;
            const linkElement = document.getElementById('wikipedia-link');
            linkElement.href = wikiUrl;
            linkElement.innerText = `📖 Lire "${currentTitle}" sur Wikipédia`;
            document.getElementById('wikipedia-link-container').style.display = 'block';

            if (page.original && page.original.source) {
                const imgElement = document.getElementById('place-image');
                imgElement.src = page.original.source;
                document.getElementById('place-image-container').style.display = 'block';
            }

            let fullText = page.extract || "";

            if (fullText.trim() === '') {
                setStatus("L'article trouvé ne contient pas assez de texte.");
                document.getElementById('listen-btn').disabled = false;
                return;
            }

            allParagraphs = fullText.split('\n').filter(p => p.trim().length > 0);
            currentParagraphIndex = 0;

            const firstBatch = allParagraphs.slice(currentParagraphIndex, currentParagraphIndex + 5).join(" ");
            currentParagraphIndex += 5;

            const outputDiv = document.getElementById('output');
            outputDiv.innerText = firstBatch;
            outputDiv.style.display = 'block';

            if (currentParagraphIndex < allParagraphs.length) {
                document.getElementById('more-btn').style.display = 'block';
            }

            setStatus("Lecture audio en cours...");
            speakText(`Voici la présentation détaillée de ${currentTitle}. ${firstBatch}`);

        } catch (err) {
            console.error(err);
            setStatus("Erreur lors du chargement des détails.");
            document.getElementById('listen-btn').disabled = false;
        }
    }

    function loadMoreDetails() {
        if (currentParagraphIndex >= allParagraphs.length) {
            setStatus("Vous avez écouté tout le contenu disponible.");
            document.getElementById('more-btn').style.display = 'none';
            return;
        }

        const nextBatch = allParagraphs.slice(currentParagraphIndex, currentParagraphIndex + 5).join(" ");
        currentParagraphIndex += 5;

        const outputDiv = document.getElementById('output');
        outputDiv.innerText += "\n\n" + nextBatch;
        outputDiv.scrollTop = outputDiv.scrollHeight;

        if (currentParagraphIndex >= allParagraphs.length) {
            document.getElementById('more-btn').style.display = 'none';
        }

        setStatus("Lecture de la suite en cours...");
        speakText(`Poursuivons la découverte de ${currentTitle}. ${nextBatch}`);
    }

    function speakText(text) {
        if (synth.speaking) {
            synth.cancel();
        }

        currentUtterance = new SpeechSynthesisUtterance(text);
        currentUtterance.lang = 'fr-FR';
        
        const speedSelect = document.getElementById('speed-select');
        currentUtterance.rate = parseFloat(speedSelect.value);

        currentUtterance.onend = () => {
            setStatus("Lecture terminée.");
            document.getElementById('listen-btn').disabled = false;
            document.getElementById('pause-btn').disabled = true;
            document.getElementById('stop-btn').disabled = true;
        };

        currentUtterance.onerror = (e) => {
            console.error(e);
            setStatus("Erreur lors de la lecture audio.");
            document.getElementById('listen-btn').disabled = false;
        };

        synth.speak(currentUtterance);
        document.getElementById('pause-btn').disabled = false;
        document.getElementById('stop-btn').disabled = false;
    }

    function changeSpeed() {
        if (synth.speaking && !synth.paused && currentUtterance) {
            const speed = parseFloat(document.getElementById('speed-select').value);
            currentUtterance.rate = speed;
        }
    }

    function pauseAudio() {
        if (synth.speaking) {
            if (synth.paused) {
                synth.resume();
                document.getElementById('pause-btn').innerText = "Pause";
                setStatus("Lecture audio en cours...");
            } else {
                synth.pause();
                document.getElementById('pause-btn').innerText = "Reprendre";
                setStatus("Lecture en pause.");
            }
        }
    }

    function stopAudio() {
        if (synth.speaking || synth.paused) {
            synth.cancel();
            setStatus("Lecture arrêtée.");
            document.getElementById('listen-btn').disabled = false;
            document.getElementById('pause-btn').disabled = true;
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('pause-btn').innerText = "Pause";
        }
    }
</script>

</body>
</html>
